[project]
name = "tutu-mcp"
version = "0.2.0"
description = "Локальный Python MCP для поиска прямых поездов Туту"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "playwright==1.65.2", "pydantic==2.14.4"]
[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-asyncio==1.5.0"]

[project.scripts]
tutu-trains = "tutu_mcp.server:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["tutu_mcp*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
